<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040">
  <style type="text/css"><![CDATA[svg text{font-family:Arial,Helvetica,sans-serif;paint-order:stroke fill;stroke:#fafafa;stroke-width:3px;stroke-linejoin:round}]]></style>
  <rect width="1200" height="1040" fill="#fafafa"/>
  <text x="16" y="28" font-size="16" font-weight="bold">WIRING DIAGRAM - 12 V Controller, Motor, Hall Sensor, Manual Button</text>
  <text x="16" y="48" font-size="12" fill="#333">(KAPCSOLÁSI RAJZ — 12 V-os vezérlő, motor, Hall-érzékelő, kézi gomb)</text>
  <text x="16" y="68" font-size="11" fill="#555">Low-side MOSFET switching | Common ground at PSU | Fuse motor line 500 mA</text>
  <text x="16" y="86" font-size="11" fill="#555">(Alsó oldali MOSFET-kapcsolás | közös föld a tápegységnél | a motorág biztosítéka 500 mA)</text>
  <g transform="translate(0, 40)">

  <!-- PSU (20) -->
  <rect x="60" y="120" width="120" height="80" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="120" y="155" text-anchor="middle" font-size="13" font-weight="bold">(20)</text>
  <text x="120" y="172" text-anchor="middle" font-size="11">12 V PSU 2A</text>
  <text x="120" y="186" text-anchor="middle" font-size="9">(12 V-os tápegység, 2 A)</text>

  <!-- Controller (21) -->
  <rect x="320" y="100" width="200" height="120" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="420" y="125" text-anchor="middle" font-size="13" font-weight="bold">(21) Controller (vezérlő)</text>
  <text x="420" y="150" text-anchor="middle" font-size="10">Arduino Nano + DS3231</text>
  <text x="332" y="170" font-size="9">D2 - Hall (22) (Hall-érzékelő)</text>
  <text x="332" y="184" font-size="9">D3 - MOSFET gate (MOSFET-kapu)</text>
  <text x="332" y="198" font-size="9">D4 - Button (23) (gomb)</text>

  <!-- MOSFET (24) -->
  <rect x="580" y="200" width="70" height="90" fill="#fff" stroke="#333"/>
  <text x="615" y="235" text-anchor="middle" font-size="11">(24)</text>
  <text x="615" y="252" text-anchor="middle" font-size="9">IRLZ44N</text>
  <text x="615" y="268" text-anchor="middle" font-size="9">D S G</text>

  <!-- Motor (14) -->
  <circle cx="780" cy="240" r="35" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
  <text x="780" y="245" text-anchor="middle" font-size="11">(14) M</text>
  <text x="830" y="248" font-size="10">12V gearmotor (hajtóműves motor)</text>

  <!-- Diode (25) -->
  <path d="M720 180 L750 180 L750 210 L720 210 Z" fill="#fff" stroke="#333"/>
  <line x1="735" y1="180" x2="735" y2="210" stroke="#333"/>
  <polygon points="735,195 725,188 725,202" fill="#333"/>
  <text x="800" y="188" font-size="10">(25) 1N5819</text>
  <text x="800" y="202" font-size="10">(szabadonfutó dióda)</text>

  <!-- Hall (22) -->
  <rect x="320" y="280" width="90" height="50" fill="#fff9c4" stroke="#f9a825"/>
  <text x="365" y="302" text-anchor="middle" font-size="11">(22) Hall</text>
  <text x="365" y="316" text-anchor="middle" font-size="9">(Hall-érzékelő)</text>

  <!-- Button (23) -->
  <circle cx="365" cy="380" r="22" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="365" y="385" text-anchor="middle" font-size="10">(23)</text>

  <!-- Fuse -->
  <rect x="680" y="160" width="40" height="16" fill="#fff" stroke="#333"/>
  <text x="700" y="152" text-anchor="middle" font-size="9">500mA</text>

  <!-- Wires -->
  <!-- +12 rail red -->
  <line x1="180" y1="140" x2="680" y2="140" stroke="#c62828" stroke-width="3"/>
  <line x1="680" y1="140" x2="680" y2="168" stroke="#c62828" stroke-width="3"/>
  <line x1="720" y1="140" x2="780" y2="140" stroke="#c62828" stroke-width="3"/>
  <line x1="780" y1="140" x2="780" y2="205" stroke="#c62828" stroke-width="3"/>
  <text x="200" y="128" font-size="11" fill="#c62828">+12 V (red) (piros)</text>

  <!-- GND rail black -->
  <line x1="180" y1="190" x2="420" y2="190" stroke="#212121" stroke-width="3"/>
  <line x1="420" y1="190" x2="420" y2="220" stroke="#212121" stroke-width="3"/>
  <line x1="420" y1="220" x2="615" y2="280" stroke="#212121" stroke-width="3"/>
  <line x1="615" y1="280" x2="780" y2="280" stroke="#212121" stroke-width="3"/>
  <text x="40" y="230" font-size="11" fill="#212121">GND (black) (fekete, föld)</text>

  <!-- 5V from Nano to Hall pull-up -->
  <line x1="420" y1="100" x2="420" y2="80" stroke="#ff9800" stroke-width="2"/>
  <line x1="420" y1="80" x2="365" y2="80" stroke="#ff9800" stroke-width="2"/>
  <line x1="365" y1="80" x2="365" y2="280" stroke="#ff9800" stroke-width="2"/>
  <text x="430" y="78" font-size="10" fill="#ff9800">5V via 10k pull-up (5 V, 10 kΩ-os felhúzó ellenálláson át)</text>

  <!-- Gate -->
  <line x1="520" y1="190" x2="580" y2="245" stroke="#4caf50" stroke-width="2"/>
  <text x="400" y="248" font-size="10" fill="#4caf50">D3 - 220- - G (D3, 220 Ω, kapu)</text>

  <!-- Motor to MOSFET drain -->
  <line x1="780" y1="275" x2="780" y2="320" stroke="#212121" stroke-width="2"/>
  <line x1="780" y1="320" x2="650" y2="320" stroke="#212121" stroke-width="2"/>
  <line x1="650" y1="320" x2="650" y2="245" stroke="#212121" stroke-width="2"/>

  <!-- Hall signal -->
  <line x1="410" y1="305" x2="340" y2="305" stroke="#9c27b0" stroke-width="2"/>
  <line x1="340" y1="305" x2="340" y2="175" stroke="#9c27b0" stroke-width="2"/>
  <text x="40" y="345" font-size="10" fill="#9c27b0">signal + 100nF to GND (jel + 100 nF a földre)</text>

  <!-- Button -->
  <line x1="365" y1="358" x2="365" y2="220" stroke="#795548" stroke-width="2"/>
  <text x="250" y="400" font-size="10">D4 INPUT_PULLUP (belső felhúzás, aktív alacsony)</text>

  <!-- Cable harness note -->
  <rect x="40" y="450" width="1120" height="490" fill="#fff" stroke="#ccc"/>
  <text x="60" y="478" font-size="14" font-weight="bold">Field wiring notes (helyszíni bekötési megjegyzések)</text>
  <text x="60" y="506" font-size="12">&#8226; Use 18 AWG for motor; 22 AWG for signals. Separate motor bundle from Hall/button in twisted sense pair if run &gt;2 m.</text>
  <text x="78" y="526" font-size="12">(A motorhoz 18 AWG, a jelekhez 22 AWG vezeték. 2 m-nél hosszabb nyomvonalnál a motorköteget a Hall-érzékelő és a gomb sodrott érpárjától elkülönítve vezessük.)</text>
  <text x="60" y="554" font-size="12">&#8226; Hall (22) mount: 2.5 mm gap to magnet (26) on wheel - align mark when pocket #1 at drop.</text>
  <text x="78" y="574" font-size="12">(A Hall-érzékelő (22) szerelése: 2,5 mm rés a kerék mágnesétől (26); a jelölés akkor essen egybe, amikor az 1. rekesz az ejtőnyílásnál van.)</text>
  <text x="60" y="602" font-size="12">&#8226; Flyback diode (25) cathode to +12 V at motor terminal; anode to MOSFET drain side.</text>
  <text x="78" y="622" font-size="12">(A szabadonfutó dióda (25) katódja a motor +12 V kapcsára, anódja a MOSFET drain oldalára kerül.)</text>
  <text x="60" y="650" font-size="12">&#8226; Enclosure (27) vent downward; silicone gland on motor cable exit from housing (5).</text>
  <text x="78" y="670" font-size="12">(A doboz (27) szellőzője lefelé nézzen; a motor kábelének kilépésénél a házból (5) szilikon tömszelence legyen.)</text>
  <text x="60" y="698" font-size="12">&#8226; PSU (20) not inside hopper - mount under stand with drip loop.</text>
  <text x="78" y="718" font-size="12">(A tápegység (20) ne a garatban legyen; az állvány alatt, cseppentőhurokkal szereljük.)</text>
  <text x="60" y="746" font-size="12">&#8226; E-stop optional: inline switch on +12 V before fuse.</text>
  <text x="78" y="766" font-size="12">(A vészleállító választható: soros kapcsoló a +12 V ágban, a biztosíték előtt.)</text>
  <text x="60" y="804" font-size="12">Connector J1 (6-pin to meter head): 1=+12V 2=GND 3=Motor+ 4=Motor- (return via MOSFET) 5=Hall sig 6=Hall GND</text>
  <text x="60" y="828" font-size="12">(J1 csatlakozó, 6 pólus az adagolófejhez: 1=+12 V, 2=föld, 3=motor+, 4=motor− a MOSFET-en át vissza, 5=Hall-jel, 6=Hall-föld)</text>
  <text x="60" y="870" font-size="11">AC in - +12 / GND (hálózati bemenet — +12 V / föld)</text>
  </g>
</svg>
