<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760">
  <style type="text/css"><![CDATA[svg text{font-family:Arial,Helvetica,sans-serif;paint-order:stroke fill;stroke:#fafafa;stroke-width:3px;stroke-linejoin:round}]]></style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#1565c0"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#fafafa"/>
  <text x="16" y="28" font-size="16" font-weight="bold">TOP VIEW - Metering Module &amp; Hopper Plan (FELÜLNÉZET — adagolómodul és garat alaprajza)</text>

  <!-- Hopper OD -->
  <circle cx="450" cy="320" r="170" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <circle cx="450" cy="320" r="155" fill="none" stroke="#1565c0" stroke-dasharray="5,4"/>
  <text x="450" y="108" text-anchor="middle" font-size="12">(1) Hopper -340 OD / -310 ID (garat, külső Ø340 / belső Ø310)</text>

  <!-- M5 bolt circle -->
  <circle cx="450" cy="320" r="140" fill="none" stroke="#666" stroke-width="1"/>
  <g fill="#455a64">
    <circle cx="450" cy="180" r="5"/><circle cx="571" cy="230" r="5"/><circle cx="621" cy="320" r="5"/>
    <circle cx="571" cy="410" r="5"/><circle cx="450" cy="460" r="5"/><circle cx="329" cy="410" r="5"/>
    <circle cx="279" cy="320" r="5"/><circle cx="329" cy="230" r="5"/>
  </g>
  <text x="640" y="300" font-size="11">6- M5 PCD 280 (6× M5, osztókör 280)</text>

  <!-- Cone throat at center -->
  <circle cx="450" cy="320" r="34" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="450" y="325" text-anchor="middle" font-size="9">-68 (torok)</text>

  <!-- Meter housing footprint -->
  <rect x="330" y="380" width="240" height="180" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="8"/>
  <text x="450" y="372" text-anchor="middle" font-size="11">(4)+(5) housing 240-180 (ház 240×180)</text>

  <!-- Wheel top view -->
  <circle cx="450" cy="470" r="60" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <g stroke="#888" stroke-width="1">
    <line x1="450" y1="410" x2="450" y2="530"/>
    <line x1="398" y1="440" x2="502" y2="500"/>
    <line x1="398" y1="500" x2="502" y2="440"/>
  </g>
  <text x="640" y="470" font-size="11">(7) -120 wheel (adagolókerék Ø120)</text>

  <!-- Motor -->
  <rect x="570" y="445" width="55" height="50" fill="#cfd8dc" stroke="#455a64" rx="4"/>
  <text x="640" y="435" font-size="11">(14) motor</text>

  <!-- Hall sensor -->
  <rect x="375" y="455" width="22" height="14" fill="#ffecb3" stroke="#f57f17"/>
  <text x="70" y="500" font-size="10">(22) Hall (Hall-érzékelő)</text>
  <text x="70" y="514" font-size="9">2.5mm from rim (2,5 mm-re a peremtől)</text>

  <!-- M4 housing screws -->
  <circle cx="360" cy="395" r="4" fill="#333"/>
  <circle cx="540" cy="395" r="4" fill="#333"/>
  <circle cx="360" cy="545" r="4" fill="#333"/>
  <circle cx="540" cy="545" r="4" fill="#333"/>
  <text x="560" y="575" font-size="10">4- M4 cap PCD 95 (4× M4 fejes csavar, osztókör 95)</text>

  <!-- Chute centerline -->
  <line x1="450" y1="530" x2="450" y2="620" stroke="#f9a825" stroke-width="4"/>
  <circle cx="450" cy="620" r="32" fill="none" stroke="#f9a825" stroke-width="2"/>
  <text x="500" y="625" font-size="11">(10) -65 chute (ejtőcsatorna Ø65)</text>

  <!-- Trough below -->
  <rect x="200" y="640" width="500" height="60" fill="#eceff1" stroke="#546e7a" stroke-width="2" rx="6"/>
  <text x="450" y="675" text-anchor="middle" font-size="12">(12) trough 600-200 (plan) (etetővályú 600×200, alaprajz)</text>

  <!-- Feed flow in hopper -->
  <path d="M450 200 L450 286" stroke="#1565c0" stroke-width="3" marker-end="url(#arr)"/>
  <text x="465" y="230" font-size="11" fill="#1565c0">gravity feed</text>
  <text x="465" y="246" font-size="11" fill="#1565c0">(gravitációs adagolás)</text>

  <!-- Controller enclosure location -->
  <rect x="900" y="420" width="100" height="70" fill="#fff" stroke="#333" stroke-dasharray="4,3"/>
  <text x="900" y="410" font-size="11">(27) controller (vezérlő)</text>
  <text x="900" y="508" font-size="10">wall-mount near stand (az állvány mellett, falra szerelve)</text>

  <!-- Manual button (23) -->
  <circle cx="950" cy="390" r="12" fill="#ef5350" stroke="#b71c1c"/>
  <text x="970" y="394" font-size="10">(23) button (kézi gomb)</text>
</svg>
